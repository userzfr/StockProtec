<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de stock - Protection Civile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body { padding: 20px; }
    .critique { background-color: #f8d7da !important; animation: clignote 1s infinite alternate; }
    .expiré { background-color: #fff3cd !important; animation: clignote 1s infinite alternate; }
    @keyframes clignote {
      from { background-color: #ff1010; }
      to { background-color: #ffb9b9; }
    }
    .btn-warning-clignote { animation: clignote 1s infinite alternate; }
    .code-barre-img svg { max-width: 100%; height: 50px; }
    .code-barre-img { max-width: 200px; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">📦 Gestion de Stock - Protection Civile</h1>

    <div class="mb-3 d-flex gap-2 flex-wrap">
      <button class="btn btn-success" onclick="ajouterProduit()">➕ Ajouter un produit</button>
      <input id="searchInput" class="form-control w-auto" type="text" placeholder="🔎 Recherche code-barres" oninput="rafraichirTableau()">
    </div>
    <p class="text-muted small">⚠️ Pensez à passer votre clavier en QWERTY pour scanner correctement les codes-barres.</p>

    <div id="notification" class="notification"></div>

    <table class="table table-bordered table-striped" id="stockTable">
      <thead class="table-dark">
        <tr>
          <th>Code-barres</th>
          <th>Nom</th>
          <th>Lot</th>
          <th>Date Péremption</th>
          <th>Date Contrôle</th>
          <th>Quantité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer class="text-center mt-5 text-muted">
    <hr>
    <p>
      Fait avec ❤️ par Mathieu.M • <a href="CGU.pdf" target="_blank">Conditions d'utilisation</a>
      <br>
      <span id="version-info">Version : chargement...</span>
    </p>
  </footer>

  <script>
    let stock = [];
    const localVersion = "V.4.1";

    async function chargerStock() {
      const res = await fetch('/donnees.json');
      stock = await res.json();
      rafraichirTableau();
    }

    function sauvegarderServeur() {
      fetch('/sauvegarder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(stock)
      });
    }

    function genererCodeCourt() {
      return "INV-" + Math.floor(100000 + Math.random() * 900000);
    }

    function afficherCodeBarreSvg(code) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      JsBarcode(svg, code, { format: "CODE128", width: 2, height: 30, displayValue: false });
      return svg.outerHTML;
    }

    function ajouterProduit() {
      let code = prompt("Code-barres (laisser vide pour générer automatiquement) :");
      if (!code) {
        code = genererCodeCourt();
        alert("Code généré : " + code);
      }
      const nom = prompt("Nom du produit :");
      const lot = prompt("Numéro de lot :");
      const peremption = prompt("Date de péremption (YYYY-MM-DD) :");
      const quantite = parseInt(prompt("Quantité :")) || 0;
      const controle = new Date().toISOString().split("T")[0];

      const existant = stock.find(p => p.code === code);
      if (existant) {
        existant.quantite += quantite;
        existant.controle = controle;
      } else {
        stock.push({ code, nom, lot, peremption, controle, quantite, etat: "rentré" });
      }
      sauvegarderServeur();
      rafraichirTableau();
    }

    function modifierProduit(index) {
      const p = stock[index];
      const nom = prompt("Nom :", p.nom);
      const lot = prompt("Lot :", p.lot);
      const peremption = prompt("Péremption (YYYY-MM-DD) :", p.peremption);
      const quantite = prompt("Quantité :", p.quantite);

      if (nom) p.nom = nom;
      if (lot) p.lot = lot;
      if (peremption) p.peremption = peremption;
      if (quantite) p.quantite = parseInt(quantite);

      sauvegarderServeur();
      rafraichirTableau();
    }

    function controlerProduit(index) {
      stock[index].controle = new Date().toISOString().split("T")[0];
      sauvegarderServeur();
      rafraichirTableau();
    }

    function supprimer(index) {
      const code = stock[index].code;
      if (confirm("Supprimer ce produit ?")) {
        fetch(`/supprimer/${encodeURIComponent(code)}`, { method: "DELETE" })
         .then(res => {
            if (res.ok) {
              stock.splice(index, 1);
              rafraichirTableau();
            } else {
              alert("Erreur lors de la suppression en base.");
            }
         });
      }
    }


    function changerEtat(index) {
      const produit = stock[index];
      produit.etat = produit.etat === "sorti" ? "rentré" : "sorti";
      sauvegarderServeur();
      rafraichirTableau();
    }

    function rafraichirTableau() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const tbody = document.querySelector("#stockTable tbody");
      tbody.innerHTML = "";
      const now = new Date();

      stock.forEach((item, index) => {
        if (search && !item.code.toLowerCase().includes(search)) return;

        const peremption = item.peremption ? new Date(item.peremption) : null;
        const controle = item.controle ? new Date(item.controle) : null;
        const joursPeremption = peremption ? Math.floor((peremption - now) / (1000 * 60 * 60 * 24)) : Infinity;
        const joursControle = controle ? Math.floor((now - controle) / (1000 * 60 * 60 * 24)) : Infinity;

        let classe = "";
        let alerteBtn = "";
        if (joursPeremption < 0 || joursControle > 30) {
          classe = "critique";
          alerteBtn = `<button class="btn btn-danger btn-sm btn-warning-clignote" disabled title="Produit à surveiller">⚠️</button>`;
        } else if (joursPeremption < 30 || joursControle > 20) {
          classe = "expiré";
          alerteBtn = `<button class="btn btn-warning btn-sm btn-warning-clignote" disabled title="Produit bientôt périmé ou à contrôler">⚠️</button>`;
        }

        const row = `
          <tr class="${classe}">
            <td><div class="code-barre-img">${afficherCodeBarreSvg(item.code)}<div class="small">${item.code}</div></div></td>
            <td>${item.nom}</td>
            <td>${item.lot}</td>
            <td>${item.peremption}</td>
            <td>${item.controle}</td>
            <td>${item.quantite}</td>
            <td>
              ${alerteBtn}
              <button class="btn btn-sm btn-${item.etat === 'sorti' ? 'danger' : 'success'} me-1" title="Changer l'état (Sorti/Rentré)" onclick="changerEtat(${index})">
                ${item.etat === 'sorti' ? '📥' : '📤'}
              </button>
              
              <button class="btn btn-sm btn-secondary me-1" onclick="modifierProduit(${index})" title="Modifier">✏️</button>
              <button class="btn btn-sm btn-info me-1" onclick="controlerProduit(${index})" title="Mettre à jour la date de contrôle">🕵️</button>
              <button class="btn btn-sm btn-danger" onclick="supprimer(${index})" title="Supprimer">🗑️</button>
            </td>
          </tr>`;

        tbody.insertAdjacentHTML('beforeend', row);
      });
    }

    async function checkLatestVersion() {
      try {
        const response = await fetch("https://api.github.com/repos/userzfr/StockProtec/releases/latest");
        if (!response.ok) throw new Error("Erreur HTTP");

        const data = await response.json();
        const latestVersion = data.tag_name.replace(/^v/, "");

        const versionInfo = document.getElementById("version-info");

        if (localVersion === latestVersion) {
          versionInfo.textContent = `Version : ${localVersion} (A jour)`;
        } else {
          versionInfo.innerHTML = `Version : ${localVersion} <span style="color: red;">(⚠️ Mise à jour disponible : ${latestVersion})</span>`;
        }
      } catch (err) {
        console.error("Erreur lors de la récupération de la version :", err);
        document.getElementById("version-info").textContent = `Version : ${localVersion} (impossible de vérifier les mises à jour)`;
      }
    }

    checkLatestVersion();
    window.onload = chargerStock;
  </script>
</body>
</html>
